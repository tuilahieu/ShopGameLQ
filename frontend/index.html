<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=Google+Sans:wght@400;500;600;700&amp;display=swap"
    />
    <title>Shopaccco.com - Trao đổi mua bán acc uy tín</title>
    <meta
      name="description"
      content="Hệ thống bán tài khoản game Liên Quân Mobile tự động uy tín, giá rẻ, chất lượng cao. Giao dịch an toàn, tự động nhận tài khoản sau 2 giây."
    />
    <meta
      name="keywords"
      content="shop acc, mua acc game, shop lien quan, acc lien quan tu chon, shop acc gia re"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Shopaccco.com - Trao đổi mua bán acc uy tín"
    />
    <meta
      property="og:description"
      content="Hệ thống bán tài khoản game Liên Quân Mobile tự động uy tín, giá rẻ, chất lượng cao. Giao dịch an toàn, tự động nhận tài khoản sau 2 giây."
    />
    <style>
      :root {
        --boot-bg: #fff8e9;
        --boot-surface: #fffdf8;
        --boot-text: #202027;
        --boot-border: #cfc4b4;
        --boot-accent: #c64232;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --boot-bg: #171820;
        --boot-surface: #23242d;
        --boot-text: #fffaf0;
        --boot-border: #4d4f5b;
        --boot-accent: #ee7566;
        color-scheme: dark;
      }
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }
      #app-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 24px;
        background:
          radial-gradient(
            circle at 50% 45%,
            color-mix(in srgb, var(--boot-accent) 10%, transparent),
            transparent 22rem
          ),
          var(--boot-bg);
        font-family: "Google Sans", "Segoe UI", sans-serif;
      }
      .boot-card {
        width: min(100%, 15rem);
        display: grid;
        justify-items: center;
        box-sizing: border-box;
        padding: 24px;
        color: var(--boot-text);
        background: var(--boot-surface);
        border: 1px solid var(--boot-border);
        border-radius: 18px;
        box-shadow: 0 18px 46px rgb(54 38 24/0.14);
      }
      .boot-spinner {
        position: relative;
        width: 144px;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
      }
      .boot-spinner::before,
      .boot-spinner::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        animation: boot-spin 1.05s linear infinite;
      }
      .boot-spinner::before {
        border: 3px solid color-mix(in srgb, var(--boot-accent) 14%, transparent);
        border-top-color: var(--boot-accent);
        border-right-color: var(--boot-accent);
      }
      .boot-spinner::after {
        background: radial-gradient(circle at 50% 5px, #f1c45b 0 5px, transparent 5.5px);
      }
      .boot-brand {
        position: relative;
        display: inline-flex;
        align-items: baseline;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -1.5px;
        line-height: 1;
      }
      .boot-brand strong {
        color: var(--boot-text);
      }
      .boot-brand b {
        color: var(--boot-accent);
      }
      .boot-brand::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -8px;
        width: 56%;
        height: 3px;
        border-radius: 999px;
        background: var(--boot-accent);
      }
      @keyframes boot-spin {
        to {
          transform: rotate(1turn);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner::before,
        .boot-spinner::after {
          animation: none;
        }
      }
    </style>
    <script>
      try {
        const savedTheme = localStorage.getItem("theme");
        const resolvedTheme =
          savedTheme === "dark" ||
          (savedTheme === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = resolvedTheme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div
      id="app-boot-loader"
      role="status"
      aria-live="polite"
      aria-label="Đang mở cửa hàng"
    >
      <div class="boot-card" aria-hidden="true">
        <span class="boot-spinner">
          <span class="boot-brand"><strong>Shop</strong><b>AccCo</b></span>
        </span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
