    <style>
      :root{--boot-bg:#f7f8fa;--boot-border:#d8dee8;--boot-accent:#c51646;color-scheme:light}
      :root[data-theme="dark"]{--boot-bg:#0b1220;--boot-border:#334155;--boot-accent:#e11d48;color-scheme:dark}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
    </style>
    <script>
      try {
        const savedTheme = localStorage.getItem("theme");
        const resolvedTheme = savedTheme === "dark" || (savedTheme === "system" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        document.documentElement.dataset.theme = resolvedTheme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="app-boot-loader" role="status" aria-label="Đang tải" style="position:fixed;inset:0;display:grid;place-content:center;background:var(--boot-bg);z-index:9999"><span style="width:28px;height:28px;margin:auto;border:3px solid var(--boot-border);border-top-color:var(--boot-accent);border-radius:50%;animation:boot-spin .75s linear infinite"></span></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
