<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=Google+Sans:wght@400;500;600;700&amp;display=swap" />
    <title>Shopgameliqi - Shop Bán Acc Liên Quân Uy Tín, Giá Rẻ</title>
    <meta name="description" content="Hệ thống bán tài khoản game Liên Quân Mobile tự động uy tín, giá rẻ, chất lượng cao. Giao dịch an toàn, tự động nhận tài khoản sau 2 giây." />
    <meta name="keywords" content="shop acc, mua acc game, shop lien quan, acc lien quan tu chon, shop acc gia re" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shopgameliqi - Shop Bán Acc Liên Quân Uy Tín, Giá Rẻ" />
    <meta property="og:description" content="Hệ thống bán tài khoản game Liên Quân Mobile tự động uy tín, giá rẻ, chất lượng cao. Giao dịch an toàn, tự động nhận tài khoản sau 2 giây." />
    <style>
      :root{--boot-bg:#fff8e9;--boot-surface:#fffdf8;--boot-text:#202027;--boot-muted:#62677a;--boot-border:#cfc4b4;--boot-track:#eee3d2;--boot-accent:#c64232;color-scheme:light}
      :root[data-theme="dark"]{--boot-bg:#171820;--boot-surface:#23242d;--boot-text:#fffaf0;--boot-muted:#c4bdaf;--boot-border:#4d4f5b;--boot-track:#3a3b45;--boot-accent:#ee7566;color-scheme:dark}
      html,body,#root{min-height:100%;margin:0}
      #app-boot-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;box-sizing:border-box;padding:24px;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--boot-accent) 10%,transparent),transparent 22rem),var(--boot-bg);font-family:"Google Sans","Segoe UI",sans-serif}
      .boot-card{width:min(100%,17rem);display:grid;justify-items:center;gap:14px;box-sizing:border-box;padding:24px 22px 20px;color:var(--boot-text);background:var(--boot-surface);border:1px solid var(--boot-border);border-radius:18px;box-shadow:0 18px 46px rgb(54 38 24/.14)}
      .boot-brand{position:relative;display:inline-flex;align-items:baseline;font-size:24px;font-weight:800;letter-spacing:-1.5px;line-height:1}
      .boot-brand strong{color:var(--boot-text)}
      .boot-brand b{color:var(--boot-accent)}
      .boot-brand::after{content:"";position:absolute;left:0;bottom:-8px;width:56%;height:3px;border-radius:999px;background:var(--boot-accent)}
      .boot-copy{margin:2px 0 0;color:var(--boot-muted);font-size:14px;font-weight:600;line-height:1.45;text-align:center}
      .boot-track{width:100%;height:4px;overflow:hidden;border-radius:999px;background:var(--boot-track)}
      .boot-track::after{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:var(--boot-accent);animation:boot-progress 1.1s ease-in-out infinite}
      @keyframes boot-progress{0%{transform:translateX(-115%)}55%,100%{transform:translateX(245%)}}
      @media (prefers-reduced-motion:reduce){.boot-track::after{width:65%;animation:none}}
    </style>
    <script>
      try {
        const savedTheme = localStorage.getItem("theme");
        const resolvedTheme = savedTheme === "dark" || (savedTheme === "system" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        document.documentElement.dataset.theme = resolvedTheme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="app-boot-loader" role="status" aria-live="polite" aria-label="Đang mở cửa hàng">
      <div class="boot-card" aria-hidden="true">
        <span class="boot-brand"><strong>Shop</strong><b>Game</b></span>
        <p class="boot-copy">Đang mở cửa hàng…</p>
        <span class="boot-track"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
