<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=Google+Sans:wght@400;500;600;700&amp;display=swap"
    />
    <title>Shopaccco.com - Trao đổi mua bán acc uy tín</title>
    <meta
      name="description"
      content="Hệ thống bán tài khoản game Liên Quân Mobile tự động uy tín, giá rẻ, chất lượng cao. Giao dịch an toàn, tự động nhận tài khoản sau 2 giây."
    />
    <meta
      name="keywords"
      content="shop acc, mua acc game, shop lien quan, acc lien quan tu chon, shop acc gia re"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Shopaccco.com - Trao đổi mua bán acc uy tín"
    />
    <meta
      property="og:description"
      content="Hệ thống bán tài khoản game Liên Quân Mobile tự động uy tín, giá rẻ, chất lượng cao. Giao dịch an toàn, tự động nhận tài khoản sau 2 giây."
    />
    <style>
      :root {
        --boot-bg: #fff8e9;
        --boot-surface: #fffdf8;
        --boot-text: #202027;
        --boot-muted: #62677a;
        --boot-border: #cfc4b4;
        --boot-track: #eee3d2;
        --boot-accent: #c64232;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --boot-bg: #171820;
        --boot-surface: #23242d;
        --boot-text: #fffaf0;
        --boot-muted: #c4bdaf;
        --boot-border: #4d4f5b;
        --boot-track: #3a3b45;
        --boot-accent: #ee7566;
        color-scheme: dark;
      }
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }
      #app-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        background:
          radial-gradient(circle at 50% 42%, rgb(255 222 154 / 0.3), transparent 28rem),
          linear-gradient(145deg, #fffaf0 0%, #f8f2e7 100%);
        color: #17171f;
        font-family: "Google Sans", "Segoe UI", sans-serif;
      }
      .bundle-loading-card {
        width: min(100%, 21rem);
        display: grid;
        justify-items: center;
        gap: 1.15rem;
        padding: 2rem 1.5rem 1.5rem;
        background: rgb(255 255 255 / 0.82);
        border: 1px solid rgb(45 45 55 / 0.14);
        border-radius: 1.35rem;
        box-shadow: 0 1.2rem 3.5rem rgb(70 49 26 / 0.14);
        backdrop-filter: blur(12px);
      }
      .bundle-loading-mark {
        position: relative;
        width: 8.75rem;
        height: 8.75rem;
        display: grid;
        place-items: center;
      }
      .bundle-loading-logo {
        position: relative;
        z-index: 2;
        display: inline-flex;
        align-items: baseline;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.075em;
        white-space: nowrap;
      }
      .bundle-loading-logo strong { color: #17171f; }
      .bundle-loading-logo b { color: #c64232; }
      .bundle-loading-logo > i {
        position: absolute;
        left: 0;
        bottom: -0.38rem;
        width: 4.5rem;
        height: 0.22rem;
        border-radius: 99rem;
        background: #c64232;
      }
      .bundle-loading-logo > i::after {
        content: "";
        position: absolute;
        right: -3.85rem;
        top: -2.18rem;
        width: 0.42rem;
        height: 0.42rem;
        border-radius: 50%;
        background: #f1c45b;
      }
      .bundle-loading-orbit,
      .bundle-loading-orbit::before {
        position: absolute;
        inset: 0;
        border-radius: 50%;
      }
      .bundle-loading-orbit {
        border: 2px solid rgb(198 66 50 / 0.12);
        animation: bundle-loader-spin 1.8s linear infinite;
      }
      .bundle-loading-orbit::before {
        content: "";
        border-top: 3px solid #c64232;
        border-right: 3px solid transparent;
      }
      .bundle-loading-orbit > i {
        position: absolute;
        width: 0.52rem;
        height: 0.52rem;
        border-radius: 50%;
        background: #f1c45b;
        box-shadow: 0 0 0 0.3rem rgb(241 196 91 / 0.14);
      }
      .bundle-loading-orbit > i:nth-child(1) { top: 0.45rem; left: 2rem; }
      .bundle-loading-orbit > i:nth-child(2) { right: -0.05rem; bottom: 2.8rem; background: #c64232; }
      .bundle-loading-orbit > i:nth-child(3) { left: 0.55rem; bottom: 1.2rem; width: 0.32rem; height: 0.32rem; }
      .bundle-loading-track {
        width: min(100%, 13rem);
        height: 0.3rem;
        overflow: hidden;
        border-radius: 99rem;
        background: #eee7dc;
      }
      .bundle-loading-track > i {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #f1c45b, #c64232);
        animation: bundle-loader-progress 1.25s ease-in-out infinite;
      }
      [data-theme="dark"] #app-boot-loader,
      [data-theme="dark"] .bundle-loading-overlay {
        background:
          radial-gradient(circle at 50% 42%, rgb(198 66 50 / 0.15), transparent 28rem),
          linear-gradient(145deg, #171820 0%, #101117 100%);
        color: #fffaf0;
      }
      [data-theme="dark"] .bundle-loading-card {
        background: rgb(35 36 45 / 0.88);
        border-color: rgb(255 255 255 / 0.12);
        box-shadow: 0 1.2rem 3.5rem rgb(0 0 0 / 0.28);
      }
      [data-theme="dark"] .bundle-loading-logo strong { color: #fffaf0; }
      [data-theme="dark"] .bundle-loading-track { background: #3a3b45; }
      @keyframes bundle-loader-spin { to { transform: rotate(1turn); } }
      @keyframes bundle-loader-progress {
        0% { transform: translateX(-115%); }
        55%, 100% { transform: translateX(225%); }
      }
      @media (max-width: 47.99rem) {
        .bundle-loading-card {
          width: min(100%, 18rem);
          padding: 1.6rem 1.2rem 1.25rem;
          border-radius: 1.15rem;
        }
        .bundle-loading-mark { width: 7.5rem; height: 7.5rem; }
        .bundle-loading-logo { font-size: 1.3rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        .bundle-loading-orbit { animation-duration: 4s; }
        .bundle-loading-track > i { animation: none; transform: none; width: 65%; }
      }
    </style>
    <script>
      try {
        const savedTheme = localStorage.getItem("theme");
        const resolvedTheme =
          savedTheme === "dark" ||
          (savedTheme === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = resolvedTheme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div
      id="app-boot-loader"
      class="bundle-loading-overlay"
      role="status"
      aria-live="polite"
      aria-label="Đang mở cửa hàng"
    >
      <div class="bundle-loading-card" aria-hidden="true">
        <div class="bundle-loading-mark">
          <span class="bundle-loading-logo"><strong>Shop</strong><b>Game</b><i /></span>
          <span class="bundle-loading-orbit"><i /><i /><i /></span>
        </div>
        <span class="bundle-loading-track"><i /></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
